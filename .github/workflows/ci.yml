name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly: re-verify pinned browser images still start and match
  workflow_dispatch:
    inputs:
      safari:
        description: Run the Safari job on a self-hosted runner labelled macos-safari16
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/gen-grid-toml.mjs --check
      - run: node scripts/check-licenses.mjs
      - run: npm audit --omit=dev --audit-level=high
      - name: Compose files are valid
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.static.yaml config -q
          docker compose -f compose.yaml -f compose.legacy-amd64.yaml config -q
          docker compose -f compose.worker-amd64.yaml config -q
          docker compose -f compose.yaml -f compose.remote-workers.example.yaml config -q
      - name: No private keys committed
        run: '! git grep -n -E "BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY" -- ":!.github/workflows/ci.yml"'

  multiarch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build app image for linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: docker/Dockerfile, platforms: 'linux/amd64,linux/arm64', push: false }
      - name: Build grid image for linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: docker/Dockerfile.grid, platforms: 'linux/amd64,linux/arm64', push: false }

  # Real browsers on a GitHub-hosted Linux amd64 runner: Firefox, Chrome and Edge current builds.
  live-default:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: docker compose up -d --build --wait --wait-timeout 1200
      - run: npm run doctor -- --check-url http://app:3000/fixture/
      - run: npm run test:grid
      - run: CATALOG_ID=chrome-149-linux-amd64 BROWSER_NAME=chrome npm run test:grid
      - run: node tests/integration/live-smoke.mjs --catalog firefox-149-linux --restart
      - run: node tests/integration/live-smoke.mjs --catalog chrome-149-linux-amd64
      - run: node tests/integration/live-smoke.mjs --catalog edge-149-linux-amd64
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-default-logs
          retention-days: 7
          path: |
            compose-logs.txt
            test-results/

  # Same install on Linux arm64 (only multi-arch builds are ready there; amd64-only builds must say so).
  live-arm64:
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: docker compose up -d --build --wait --wait-timeout 1200
      - run: npm run test:grid
      - run: node tests/integration/live-smoke.mjs --catalog firefox-149-linux --restart
      - name: amd64-only builds report unsupported-architecture
        run: curl -s http://127.0.0.1:3000/api/browser-builds | node -e "const b=JSON.parse(require('fs').readFileSync(0)).builds.find(x=>x.id==='chrome-109-linux-amd64'); if(b.availability!=='unsupported-architecture') process.exit(1)"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-arm64-logs
          retention-days: 7
          path: |
            compose-logs.txt
            test-results/

  # The historical acceptance targets: Google Chrome 109, Microsoft Edge 121, Firefox 115 ESR (and 115 release as a control).
  live-legacy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: docker compose -f compose.yaml -f compose.legacy-amd64.yaml up -d --build --wait --wait-timeout 1800
      - run: CATALOG_ID=chrome-109-linux-amd64 BROWSER_NAME=chrome npm run test:grid
      - run: node tests/integration/live-smoke.mjs --catalog chrome-109-linux-amd64
      - run: node tests/integration/live-smoke.mjs --catalog edge-121-linux-amd64
      - run: node tests/integration/live-smoke.mjs --catalog firefox-115esr-linux-amd64
      - run: node tests/integration/live-smoke.mjs --catalog firefox-115-release-linux-amd64
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.legacy-amd64.yaml logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-legacy-logs
          retention-days: 7
          path: |
            compose-logs.txt
            test-results/

  # Only on explicit request and only on a self-hosted Mac with Safari 16 (docs/SAFARI-WORKER.md). Skipped otherwise, never green by default.
  safari:
    if: github.event_name == 'workflow_dispatch' && inputs.safari
    runs-on: [self-hosted, macos-safari16]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      # The runner reaches a BrowserLab whose "mac" worker is this Mac (docs/SAFARI-WORKER.md). Exit code 2 = automated
      # part passed but the manual handover still has to be confirmed by a person; that is reported as a failure here.
      - run: node tests/integration/live-smoke.mjs --catalog safari-16-mac --base "${{ vars.BROWSERLAB_BASE || 'http://127.0.0.1:3000' }}"
